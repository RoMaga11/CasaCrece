<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CASA – Grupos de WhatsApp</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --coral:   #E85D4A;
      --blue:    #3A7BD5;
      --white:   #FFFFFF;
      --offwhite:#F5F6F8;
      --dark:    #1A1A2E;
      --shadow:  rgba(58,123,213,0.15);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: var(--offwhite);
      font-family: 'Montserrat', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem 3rem;
      position: relative;
      overflow-x: hidden;
    }

    /* Subtle background shape */
    body::before {
      content: '';
      position: fixed;
      top: -120px;
      left: 50%;
      transform: translateX(-50%);
      width: 600px;
      height: 600px;
      background: radial-gradient(ellipse, rgba(232,93,74,0.08) 0%, transparent 70%);
      pointer-events: none;
    }
    body::after {
      content: '';
      position: fixed;
      bottom: -100px;
      left: 50%;
      transform: translateX(-50%);
      width: 500px;
      height: 400px;
      background: radial-gradient(ellipse, rgba(58,123,213,0.10) 0%, transparent 70%);
      pointer-events: none;
    }

    /* Card container */
    .card {
      background: var(--white);
      border-radius: 28px;
      padding: 2.5rem 2rem 2.8rem;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 8px 40px rgba(58,123,213,0.12), 0 2px 8px rgba(0,0,0,0.05);
      position: relative;
      z-index: 1;
      animation: fadeUp 0.6s ease both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Header */
    .header {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 2rem;
    }

    .logo-wrap {
      width: 90px;
      height: 90px;
      border-radius: 22px;
      background: var(--dark);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 1.1rem;
      box-shadow: 0 4px 18px rgba(232,93,74,0.18);
    }
    .logo-wrap img {
      width: 68px;
      height: auto;
    }

    .brand-name {
      font-size: 1.6rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      color: var(--dark);
      text-transform: uppercase;
    }

    .tagline {
      margin-top: 0.35rem;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--blue);
      letter-spacing: 0.22em;
      text-transform: uppercase;
    }

    /* Divider */
    .divider {
      width: 40px;
      height: 3px;
      border-radius: 99px;
      background: linear-gradient(90deg, var(--coral), var(--blue));
      margin: 1.1rem auto 0;
    }

    /* Intro text */
    .intro {
      text-align: center;
      font-size: 0.82rem;
      color: #6b7280;
      margin-bottom: 1.6rem;
      line-height: 1.6;
      font-weight: 500;
    }

    /* Link buttons */
    .links {
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
    }

    .link-btn {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 1rem 1.3rem;
      border-radius: 16px;
      text-decoration: none;
      background: var(--offwhite);
      border: 1.5px solid transparent;
      transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease, background 0.18s ease;
      animation: fadeUp 0.6s ease both;
    }

    .link-btn:nth-child(1) { animation-delay: 0.10s; }
    .link-btn:nth-child(2) { animation-delay: 0.18s; }
    .link-btn:nth-child(3) { animation-delay: 0.26s; }
    .link-btn:nth-child(4) { animation-delay: 0.34s; }

    .link-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 24px var(--shadow);
      border-color: var(--blue);
      background: var(--white);
    }

    .link-icon {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 1.25rem;
    }

    /* Icon accent colors */
    .icon-base     { background: rgba(232,93,74,0.12); }
    .icon-dev1     { background: rgba(58,123,213,0.12); }
    .icon-dev2     { background: rgba(58,123,213,0.18); }
    .icon-purpose  { background: rgba(232,93,74,0.18); }

    .link-text {
      flex: 1;
    }

    .link-label {
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #9ca3af;
      margin-bottom: 0.15rem;
    }

    .link-name {
      font-size: 1rem;
      font-weight: 700;
      color: var(--dark);
      letter-spacing: 0.01em;
    }

    .link-arrow {
      color: var(--blue);
      font-size: 1.1rem;
      opacity: 0.5;
      transition: opacity 0.18s, transform 0.18s;
    }
    .link-btn:hover .link-arrow {
      opacity: 1;
      transform: translateX(4px);
    }

    /* Footer */
    .footer {
      margin-top: 2rem;
      text-align: center;
      font-size: 0.7rem;
      color: #c0c4cc;
      font-weight: 500;
      letter-spacing: 0.05em;
    }

    /* WhatsApp icon SVG inline */
    .wa-svg { width: 24px; height: 24px; }
  </style>
</head>
